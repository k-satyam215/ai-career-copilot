services:
  api:
    build:
      context: .
      target: api
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  ui:
    build:
      context: .
      target: ui
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      - api
    restart: unless-stopped

  mcp:
    build:
      context: .
      target: mcp
    env_file:
      - .env
    restart: unless-stopped
